services:
  # Dados de faturamento (fase 1)
  postgres:
    image: postgres:17
    container_name: conciliador-db
    environment:
      POSTGRES_USER: conc
      POSTGRES_PASSWORD: conc
      POSTGRES_DB: conciliador
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conc -d conciliador"]
      interval: 3s
      retries: 10

  # Checkpointer do agente (fase 2): guarda as investigações pausadas esperando aprovação.
  # Redis 8 já traz os módulos JSON e Search que o RedisSaver usa. AOF = sobrevive a reinício.
  redis:
    image: redis:8
    container_name: conciliador-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  # Fase 4: API do conciliador. A chave vem do .env (CONCILIADOR_API_KEY).
  api:
    build: .
    container_name: conciliador-api
    environment:
      DATABASE_URL: postgresql://conc:conc@postgres:5432/conciliador
      CONCILIADOR_API_KEY: ${CONCILIADOR_API_KEY:?defina CONCILIADOR_API_KEY no .env}
      DATA_BASE: ${DATA_BASE:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }

  # Fase 4: n8n agenda a conciliação e manda o resumo por e-mail. Chama a API por http://api:8000.
  n8n:
    image: n8nio/n8n:latest
    container_name: conciliador-n8n
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on: [api]

volumes:
  pg_data:
  redis_data:
  n8n_data:
